name: Compress and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compress new photos from inbox
        run: |
          pip install --quiet pillow
          python process.py

      - name: Save compressed files
        run: |
          git config user.name "duchfomhair-bot"
          git config user.email "duchfomhair-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add compressed artwork [skip ci]"
          git push

      - name: Build site folder
        run: |
          mkdir -p _site
          cp -r 20*/ _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
